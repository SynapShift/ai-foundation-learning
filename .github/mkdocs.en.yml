site_name: AI Foundation Handbook
site_url: https://synapshift.github.io/ai-foundation-learning/en/
docs_dir: ../handbook/en
site_dir: ../site/en
repo_url: https://github.com/SynapShift/ai-foundation-learning
repo_name: SynapShift/ai-foundation-learning
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.tracking
    - search.suggest
    - content.code.copy
  palette:
    primary: custom
    accent: custom
extra_css:
  - stylesheets/handbook.css
plugins:
  - search
extra:
  alternate:
    - name: 中文
      link: /ai-foundation-learning/zh/
      lang: zh
    - name: English
      link: /ai-foundation-learning/en/
      lang: en
nav:
  - Home: README.md
  - LLM:
      - Course index: llm/README.md
      - 01 Attention: llm/01-attention.md
      - 02 Hidden States and Softmax: llm/02-hidden-states-and-output.md
      - 03 Transformer Block: llm/03-transformer-block.md
      - 04 Autoregressive Generation: llm/04-generation.md
      - 05 Inference Engineering: llm/05-inference-engineering.md
      - 06 Pretraining: llm/06-pretraining.md
      - 07 Instruction and Preference Alignment: llm/07-alignment.md
      - 08 Evaluation and Generalization: llm/08-evaluation.md
      - 09 Agent and Harness: llm/09-agent-harness.md
