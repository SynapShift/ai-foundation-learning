name: Publish handbook

on:
  push:
    branches: [main]
    paths:
      - handbook/**
      - .github/mkdocs.*.yml
      - .github/requirements-docs.txt
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify private state is not tracked
        run: test -z "$(git ls-files '.local-learning/**')"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/requirements-docs.txt
      - run: python -m mkdocs build --strict --config-file .github/mkdocs.zh.yml
      - run: python -m mkdocs build --strict --config-file .github/mkdocs.en.yml
      - run: cp handbook/index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
