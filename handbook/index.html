<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Foundation Handbook</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; color: #26343b; background: #f7faf9; }
    main { width: min(100% - 40px, 480px); }
    h1 { font-size: 28px; margin: 0 0 24px; }
    nav { display: grid; gap: 10px; }
    a { display: block; padding: 14px 16px; border: 1px solid #cad9d5; border-radius: 6px; color: #145d53; background: white; text-decoration: none; font-weight: 600; }
    a:hover, a:focus-visible { border-color: #187767; background: #eaf5f1; }
  </style>
</head>
<body>
  <main>
    <h1>AI Foundation Handbook</h1>
    <nav aria-label="Choose a language">
      <a href="zh/" lang="zh">中文版</a>
      <a href="en/" lang="en">English edition</a>
    </nav>
  </main>
</body>
</html>
